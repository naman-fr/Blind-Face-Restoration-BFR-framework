[tool.poetry]
name = "bfr_framework"
version = "0.1.0"
description = "Industry-grade Blind Face Restoration framework using DifFace with Adaptive N and Ensemble selection."
authors = ["Naman <naman@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "bfr_framework", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.0.0"
torchvision = ">=0.15.0"
gradio = "^4.0.0"
opencv-python = "^4.8.0"
numpy = "^1.24.0"
scipy = "^1.11.0"
timm = "^0.9.0"
kornia = "^0.7.0"
einops = "^0.7.0"
omegaconf = "^2.3.0"
tqdm = "^4.66.0"
loguru = "^0.7.0"
scikit-image = "^0.21.0"
basicsr = {git = "https://github.com/XPixelGroup/BasicSR.git"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"
pre-commit = "^3.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
